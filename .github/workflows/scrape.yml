name: Scheduled Job Scraper

on:
  schedule:
    # Run every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt

      - name: Run Job Scraper
        run: |
          python scraper/scraper.py

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "dominaltech-bot"
          git config --global user.email "dominaltech@gmail.com"
          git add frontend/data/jobs.json
          if git diff --staged --quiet; then
            echo "No new jobs detected."
          else
            git commit -m "chore(feed): auto-update scraped job listings [skip ci]"
            git push
          fi
